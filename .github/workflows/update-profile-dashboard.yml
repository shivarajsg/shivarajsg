name: Refresh profile engineering dashboard

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_profile_dashboard.py"
      - ".github/workflows/update-profile-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: profile-dashboard-refresh
  cancel-in-progress: true

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Generate dashboard from public GitHub metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_profile_dashboard.py

      - name: Commit dashboard if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-dashboard.svg
          if git diff --cached --quiet; then
            echo "Dashboard is already up to date."
            exit 0
          fi
          git commit -m "chore: refresh profile engineering dashboard"
          git push
