<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-labelledby="title desc">
<title id="title">Shivaraj GitHub engineering dashboard</title>
<desc id="desc">Public repository snapshot: 26 public repositories, 15 Python-primary repositories, six featured AI systems, primary language counts, and four engineering focus areas. Counts refresh daily.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#060914"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.muted{fill:#8492ad}.primary{fill:#e5edf9}.panel{fill:#10182a;stroke:#202b43;stroke-width:1}
.bar{filter:drop-shadow(0 0 4px #38bdf822)}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:1}}
</style>
<rect width="1200" height="490" rx="22" fill="url(#bg)"/>
<g stroke="#152039" stroke-width=".5" opacity=".45">
  <path d="M60 0V490 M120 0V490 M180 0V490 M240 0V490 M300 0V490 M360 0V490 M420 0V490 M480 0V490 M540 0V490 M600 0V490 M660 0V490 M720 0V490 M780 0V490 M840 0V490 M900 0V490 M960 0V490 M1020 0V490 M1080 0V490 M1140 0V490"/>
  <path d="M0 50H1200 M0 100H1200 M0 150H1200 M0 200H1200 M0 250H1200 M0 300H1200 M0 350H1200 M0 400H1200 M0 450H1200"/>
</g>
<circle cx="67" cy="39" r="4" fill="#4ade80" class="pulse"/>
<text x="82" y="43" font-size="10" letter-spacing="2.5" fill="#93c5fd">ENGINEERING TELEMETRY / PUBLIC REPOSITORIES</text>
<text x="1140" y="43" text-anchor="end" font-size="10" class="muted">SYNCED 2026-10-28 UTC</text>
<text x="60" y="83" font-size="27" font-weight="700" class="primary">Portfolio, in numbers.</text>
<text x="60" y="104" font-size="11" class="muted">Verified repository metadata · refreshed daily · public repositories only</text>
<g>
  <rect x="60" y="125" width="336" height="102" rx="13" class="panel"/><rect x="60" y="125" width="3" height="102" rx="1.5" fill="#38bdf8"/>
  <text x="80" y="151" font-size="10" letter-spacing="1.8" class="muted">PUBLIC REPOSITORIES</text>
  <text x="80" y="193" font-size="35" font-weight="700" class="primary">26</text>
  <text x="80" y="213" font-size="10" class="muted">Public repositories owned by this account</text>
  <rect x="432" y="125" width="336" height="102" rx="13" class="panel"/><rect x="432" y="125" width="3" height="102" rx="1.5" fill="#a78bfa"/>
  <text x="452" y="151" font-size="10" letter-spacing="1.8" class="muted">PYTHON-PRIMARY REPOS</text>
  <text x="452" y="193" font-size="35" font-weight="700" class="primary">15</text>
  <text x="452" y="213" font-size="10" class="muted">GitHub reports Python as the primary language</text>
  <rect x="804" y="125" width="336" height="102" rx="13" class="panel"/><rect x="804" y="125" width="3" height="102" rx="1.5" fill="#4ade80"/>
  <text x="824" y="151" font-size="10" letter-spacing="1.8" class="muted">FEATURED AI SYSTEMS</text>
  <text x="824" y="193" font-size="35" font-weight="700" class="primary">6</text>
  <text x="824" y="213" font-size="10" class="muted">Curated engineering projects shown below</text>
</g>
<rect x="60" y="246" width="620" height="190" rx="14" class="panel"/>
<text x="82" y="272" font-size="10" letter-spacing="1.8" fill="#c4b5fd">PRIMARY LANGUAGE MIX</text>
<text x="658" y="272" text-anchor="end" font-size="9" class="muted">REPOSITORY COUNT</text>
<g>
  <text x="82" y="311" font-size="11" class="primary">Python</text><rect x="235" y="300" width="285" height="13" rx="6.5" fill="#1b2740"/><rect class="bar" x="235" y="300" width="285" height="13" rx="6.5" fill="url(#bar)"><animate attributeName="width" from="0" to="285" dur=".9s" begin=".1s" fill="freeze"/></rect><text x="545" y="311" font-size="11" class="primary">15</text><text x="658" y="311" text-anchor="end" font-size="9" class="muted">58% of public repos</text>
  <text x="82" y="336" font-size="11" class="primary">TypeScript</text><rect x="235" y="325" width="285" height="13" rx="6.5" fill="#1b2740"/><rect class="bar" x="235" y="325" width="76" height="13" rx="6.5" fill="url(#bar)"><animate attributeName="width" from="0" to="76" dur=".9s" begin=".22s" fill="freeze"/></rect><text x="545" y="336" font-size="11" class="primary">4</text><text x="658" y="336" text-anchor="end" font-size="9" class="muted">15% of public repos</text>
  <text x="82" y="361" font-size="11" class="primary">JavaScript</text><rect x="235" y="350" width="285" height="13" rx="6.5" fill="#1b2740"/><rect class="bar" x="235" y="350" width="57" height="13" rx="6.5" fill="url(#bar)"><animate attributeName="width" from="0" to="57" dur=".9s" begin=".34s" fill="freeze"/></rect><text x="545" y="361" font-size="11" class="primary">3</text><text x="658" y="361" text-anchor="end" font-size="9" class="muted">12% of public repos</text>
  <text x="82" y="386" font-size="11" class="primary">HTML</text><rect x="235" y="375" width="285" height="13" rx="6.5" fill="#1b2740"/><rect class="bar" x="235" y="375" width="19" height="13" rx="6.5" fill="url(#bar)"><animate attributeName="width" from="0" to="19" dur=".9s" begin=".46s" fill="freeze"/></rect><text x="545" y="386" font-size="11" class="primary">1</text><text x="658" y="386" text-anchor="end" font-size="9" class="muted">4% of public repos</text>
  <text x="82" y="411" font-size="11" class="primary">Jupyter Notebook</text><rect x="235" y="400" width="285" height="13" rx="6.5" fill="#1b2740"/><rect class="bar" x="235" y="400" width="19" height="13" rx="6.5" fill="url(#bar)"><animate attributeName="width" from="0" to="19" dur=".9s" begin=".58s" fill="freeze"/></rect><text x="545" y="411" font-size="11" class="primary">1</text><text x="658" y="411" text-anchor="end" font-size="9" class="muted">4% of public repos</text>
</g>
<rect x="700" y="246" width="440" height="190" rx="14" class="panel"/>
<text x="722" y="272" font-size="10" letter-spacing="1.8" fill="#67e8f9">ENGINEERING FOCUS</text>
<g>
  <circle cx="732" cy="300" r="10" fill="#14243b" stroke="#334766"/><text x="732" y="303" text-anchor="middle" font-size="8" fill="#7dd3fc">01</text><text x="752" y="301" font-size="10" class="primary">RETRIEVAL SYSTEMS</text><text x="752" y="314" font-size="9" class="muted">RAG · GraphRAG · evidence</text><circle cx="1113" cy="300" r="2.8" fill="#818cf8" class="pulse"/>
  <circle cx="732" cy="331" r="10" fill="#14243b" stroke="#334766"/><text x="732" y="334" text-anchor="middle" font-size="8" fill="#7dd3fc">02</text><text x="752" y="332" font-size="10" class="primary">AGENTIC WORKFLOWS</text><text x="752" y="345" font-size="9" class="muted">tools · orchestration · state</text><circle cx="1113" cy="331" r="2.8" fill="#818cf8" class="pulse"/>
  <circle cx="732" cy="362" r="10" fill="#14243b" stroke="#334766"/><text x="732" y="365" text-anchor="middle" font-size="8" fill="#7dd3fc">03</text><text x="752" y="363" font-size="10" class="primary">LLM RELIABILITY</text><text x="752" y="376" font-size="9" class="muted">evaluation · schemas · tracing</text><circle cx="1113" cy="362" r="2.8" fill="#818cf8" class="pulse"/>
  <circle cx="732" cy="393" r="10" fill="#14243b" stroke="#334766"/><text x="732" y="396" text-anchor="middle" font-size="8" fill="#7dd3fc">04</text><text x="752" y="394" font-size="10" class="primary">BACKEND SYSTEMS</text><text x="752" y="407" font-size="9" class="muted">FastAPI · data · testing</text><circle cx="1113" cy="393" r="2.8" fill="#818cf8" class="pulse"/>
</g>
<text x="60" y="464" font-size="10" class="muted">PUBLIC SIGNALS · 3 STARS · 4 FORKS</text>
<text x="1140" y="464" text-anchor="end" font-size="9" class="muted">SOURCE: GITHUB REST API · UTC SNAPSHOT</text>
<rect x="60" y="478" width="1080" height="2" rx="1" fill="#17233b"/><rect x="60" y="478" width="240" height="2" rx="1" fill="url(#accent)"/>
</svg>
